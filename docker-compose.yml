# LicitaIA — Stack completo (desarrollo/producción ligera)
# Uso: docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licitaia}
      POSTGRES_USER: ${POSTGRES_USER:-licitaia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licitaia_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licitaia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-licitaia}:${POSTGRES_PASSWORD:-licitaia_dev}@db:5432/${POSTGRES_DB:-licitaia}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-licitaia}:${POSTGRES_PASSWORD:-licitaia_dev}@db:5432/${POSTGRES_DB:-licitaia}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-licitaia}:${POSTGRES_PASSWORD:-licitaia_dev}@db:5432/${POSTGRES_DB:-licitaia}
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-licitaia}:${POSTGRES_PASSWORD:-licitaia_dev}@db:5432/${POSTGRES_DB:-licitaia}
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
