# LicitaIA: producción, staging y desarrollo en el mismo VPS.
# Requiere certificados para los cuatro nombres:
#   /etc/letsencrypt/live/mysecop.co/{fullchain.pem,privkey.pem}
#   /etc/letsencrypt/live/stg.mysecop.co/{fullchain.pem,privkey.pem}
#   /etc/letsencrypt/live/dev.mysecop.co/{fullchain.pem,privkey.pem}

server {
    listen 80;
    listen [::]:80;
    server_name mysecop.co www.mysecop.co stg.mysecop.co dev.mysecop.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Producción
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mysecop.co www.mysecop.co;

    ssl_certificate /etc/letsencrypt/live/mysecop.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysecop.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

