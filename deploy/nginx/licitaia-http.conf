# Configuración temporal para validar los dominios con Certbot.
# Instalar en /etc/nginx/sites-available/licitaia-http.conf y enlazarlo.

server {
    listen 80;
    listen [::]:80;
    server_name mysecop.co www.mysecop.co stg.mysecop.co dev.mysecop.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
